<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabung PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1b2433;--sub:#5b6577;--line:#d8dee8;--acc:#1d5fd1;--acc2:#e8f0fd;--bad:#b3261e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:680px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.5px}
.lead{margin:0 0 20px;color:var(--sub)}
.pick{display:block;border:2px dashed var(--acc);background:var(--acc2);border-radius:14px;padding:26px 16px;text-align:center;color:var(--acc);font-weight:700;font-size:17px;cursor:pointer}
.pick small{display:block;font-weight:400;color:var(--sub);margin-top:4px;font-size:14px}
input[type=file]{display:none}
ul{list-style:none;margin:18px 0 0;padding:0}
li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm span{font-size:13px;color:var(--sub)}
.bt{flex:none;width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:18px;color:var(--ink);cursor:pointer}
.bt:disabled{opacity:.3}
.bt.x{color:var(--bad)}
.row{margin-top:18px}
label{display:block;font-size:14px;color:var(--sub);margin-bottom:4px}
input[type=text]{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.go{width:100%;margin-top:14px;padding:16px;font-size:17px;font-weight:700;color:#fff;background:var(--acc);border:0;border-radius:12px;cursor:pointer}
.go:disabled{opacity:.45}
.msg{margin-top:14px;font-size:15px}
.msg.err{color:var(--bad)}
.ok{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.ok a{display:block;text-align:center;text-decoration:none;font-weight:700;padding:14px;border-radius:10px;margin-top:10px}
.ok a.d{background:#157347;color:#fff}
.ok a.o{border:1px solid var(--line);color:var(--ink)}
.hint{color:var(--sub);font-size:13px;margin-top:20px}
</style>
</head>
<body>
<main>
<h1>Gabung PDF</h1>
<p class="lead">Satukan surat, CV, KTP, ijazah, dan transkrip jadi satu file PDF.</p>

<label class="pick" for="f">+ Pilih file<small>PDF atau foto (JPG, PNG). Boleh pilih banyak sekaligus.</small></label>
<input id="f" type="file" accept="application/pdf,image/*" multiple>

<ul id="list"></ul>

<div class="row">
<label for="nm">Nama file hasil</label>
<input id="nm" type="text" value="Lamaran-Gabungan" autocapitalize="off" autocorrect="off">
</div>
<button class="go" id="go" disabled>Gabungkan jadi satu PDF</button>
<div class="msg" id="msg"></div>
<div id="out"></div>
<p class="hint">Semua diproses di perangkatmu. File tidak diunggah ke mana pun. Urutan halaman mengikuti urutan daftar di atas; gunakan tombol ▲ ▼ untuk mengubahnya.</p>
</main>

<script>
(function(){
var items=[]; // {file, id}
var uid=0, outUrl=null;
var $=function(i){return document.getElementById(i)};
var list=$('list'), go=$('go'), msg=$('msg'), out=$('out');

function fmt(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}
function isPdf(f){return f.type==='application/pdf'||/\.pdf$/i.test(f.name)}
function say(t,err){msg.textContent=t||'';msg.className='msg'+(err?' err':'')}

function render(){
  list.innerHTML='';
  items.forEach(function(it,i){
    var li=document.createElement('li');
    li.innerHTML='<div class="no">'+(i+1)+'</div><div class="nm"><b></b><span></span></div>';
    li.querySelector('b').textContent=it.file.name;
    li.querySelector('span').textContent=(isPdf(it.file)?'PDF':'Foto')+' · '+fmt(it.file.size);
    var up=btn('▲',function(){mv(i,-1)},i===0);
    var dn=btn('▼',function(){mv(i,1)},i===items.length-1);
    var rm=btn('✕',function(){items.splice(i,1);clearOut();render()},false);rm.className+=' x';
    li.appendChild(up);li.appendChild(dn);li.appendChild(rm);
    list.appendChild(li);
  });
  go.disabled=items.length===0;
}
function btn(t,fn,dis){var b=document.createElement('button');b.type='button';b.className='bt';b.textContent=t;b.disabled=dis;b.onclick=fn;return b}
function mv(i,d){var j=i+d;if(j<0||j>=items.length)return;var t=items[i];items[i]=items[j];items[j]=t;clearOut();render()}
function clearOut(){out.innerHTML='';if(outUrl){URL.revokeObjectURL(outUrl);outUrl=null}}

$('f').addEventListener('change',function(e){
  var fs=Array.prototype.slice.call(e.target.files||[]);
  fs.forEach(function(f){items.push({file:f,id:++uid})});
  e.target.value='';
  clearOut();say('');render();
});

function readBuf(f){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){res(r.result)};
    r.onerror=function(){rej(new Error('Gagal membaca file "'+f.name+'".'))};
    r.readAsArrayBuffer(f);
  });
}
// Foto -> JPEG lewat canvas (aman untuk orientasi & transparansi)
function imgToJpeg(f){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(f), im=new Image();
    im.onload=function(){
      var w=im.naturalWidth,h=im.naturalHeight,max=2400,s=Math.min(1,max/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
      x.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){
        if(!b){rej(new Error('Gagal memproses foto "'+f.name+'".'));return}
        readBuf(b).then(function(buf){res({buf:buf,w:c.width,h:c.height})},rej);
      },'image/jpeg',0.92);
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Foto "'+f.name+'" tidak bisa dibuka. Coba simpan ulang sebagai JPG atau PNG.'))};
    im.src=url;
  });
}

async function merge(){
  var PDFDocument=PDFLib.PDFDocument;
  var doc=await PDFDocument.create();
  for(var i=0;i<items.length;i++){
    var f=items[i].file;
    say('Memproses '+(i+1)+' dari '+items.length+': '+f.name);
    if(isPdf(f)){
      var buf=await readBuf(f), src;
      try{src=await PDFDocument.load(buf,{ignoreEncryption:true})}
      catch(e){throw new Error('File "'+f.name+'" rusak atau dikunci, tidak bisa dibaca.')}
      var pgs=await doc.copyPages(src,src.getPageIndices());
      pgs.forEach(function(p){doc.addPage(p)});
    }else{
      var im=await imgToJpeg(f);
      var jpg=await doc.embedJpg(im.buf);
      // Halaman A4 (595x842), foto dipas di tengah dengan margin
      var PW=595.28,PH=841.89,M=28;
      var sc=Math.min((PW-2*M)/im.w,(PH-2*M)/im.h);
      var dw=im.w*sc,dh=im.h*sc;
      var page=doc.addPage([PW,PH]);
      page.drawImage(jpg,{x:(PW-dw)/2,y:(PH-dh)/2,width:dw,height:dh});
    }
  }
  say('Menyimpan hasil...');
  return await doc.save();
}

go.addEventListener('click',async function(){
  if(typeof PDFLib==='undefined'){say('Pustaka PDF belum termuat. Pastikan internet aktif lalu muat ulang halaman ini.',true);return}
  go.disabled=true;clearOut();say('Mulai menggabungkan...');
  try{
    var bytes=await merge();
    var blob=new Blob([bytes],{type:'application/pdf'});
    outUrl=URL.createObjectURL(blob);
    var name=($('nm').value||'Gabungan').replace(/[\\\/:*?"<>|]+/g,'').trim()||'Gabungan';
    if(!/\.pdf$/i.test(name))name+='.pdf';
    out.innerHTML='<div class="ok"><b>Selesai!</b> '+fmt(blob.size)+'<a class="d" download></a><a class="o" target="_blank" rel="noopener">Buka dulu untuk dicek</a></div>';
    var a=out.querySelector('a.d');a.href=outUrl;a.download=name;a.textContent='Simpan '+name;
    var o=out.querySelector('a.o');o.href=outUrl;
    say('');
  }catch(e){say(e.message||'Terjadi kesalahan saat menggabungkan.',true)}
  go.disabled=items.length===0;
});

render();
})();
</script>
</body>
</html>
