<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f3f8">
<title>Gabung PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{
  --bg:#f2f3f8;--card:#ffffff;--ink:#14161f;--sub:#6a7085;--line:#e3e6ef;
  --acc:#4f46e5;--acc-soft:#eceafd;--ok:#0f9d6b;--bad:#c62f3e;
  --pdf:#e5484d;--img:#0e8f9c;--shadow:0 1px 2px rgba(20,22,31,.05),0 10px 30px -12px rgba(20,22,31,.18);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1117;--card:#181b25;--ink:#eef0f7;--sub:#99a0b5;--line:#272b39;
  --acc:#8b85ff;--acc-soft:#23213f;--ok:#2fd596;--bad:#ff7a85;--shadow:0 10px 30px -12px rgba(0,0,0,.6);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:640px;margin:0 auto;padding:40px 18px 90px}
header{margin-bottom:26px}
h1{font-family:ui-serif,"New York",Georgia,serif;font-weight:600;font-size:38px;line-height:1.1;letter-spacing:-.8px;margin:0 0 10px}
.lead{margin:0;color:var(--sub);font-size:16px;max-width:46ch}

.steps{display:flex;gap:8px;margin:0 0 18px;padding:0;list-style:none}
.steps li{flex:1;font-size:13px;color:var(--sub);display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;background:transparent;border:1px solid var(--line);transition:.25s}
.steps li i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--sub);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.steps li.on{color:var(--ink);border-color:var(--acc);background:var(--acc-soft)}
.steps li.on i{background:var(--acc);color:#fff}
.steps li.done i{background:var(--ok);color:#fff}

.drop{display:block;background:var(--card);border:1.5px dashed color-mix(in srgb,var(--acc) 55%,transparent);border-radius:22px;padding:34px 20px;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:.2s}
.drop:active{transform:scale(.99)}
.drop .ic{width:56px;height:56px;margin:0 auto 12px;border-radius:18px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center}
.drop b{display:block;font-size:18px;margin-bottom:2px}
.drop span{color:var(--sub);font-size:14px}
input[type=file]{display:none}

ul.files{list-style:none;margin:16px 0 0;padding:0}
.files li{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 10px 10px 12px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--line)}
.badge{flex:none;width:44px;height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;letter-spacing:.3px}
.badge.pdf{background:var(--pdf)}.badge.img{background:var(--img)}
.badge small{font-size:10px;font-weight:600;opacity:.9}
.meta{flex:1;min-width:0}
.meta b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta span{font-size:13px;color:var(--sub)}
.ctl{display:flex;gap:4px;flex:none}
.ib{width:40px;height:44px;border:0;background:transparent;border-radius:12px;color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ib:active{background:var(--acc-soft);color:var(--acc)}
.ib:disabled{opacity:.25}
.ib.x:active{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}

.sum{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 8px;color:var(--sub);font-size:14px}
.sum button{border:0;background:none;color:var(--acc);font-size:14px;font-weight:600;padding:8px;cursor:pointer}
.field{margin-top:6px}
.field label{display:block;font-size:13px;color:var(--sub);margin:0 2px 6px}
.field div{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-size:16px;padding:14px 0;outline:none}
.field em{font-style:normal;color:var(--sub)}
.field div:focus-within{border-color:var(--acc)}

.main{width:100%;margin-top:16px;padding:17px;font-size:17px;font-weight:700;color:#fff;background:var(--acc);border:0;border-radius:16px;cursor:pointer;box-shadow:0 10px 24px -10px var(--acc);transition:.2s}
.main:active{transform:scale(.99)}
.main:disabled{opacity:.4;box-shadow:none}
.msg{margin:14px 2px 0;font-size:14px;color:var(--sub);min-height:1em}
.msg.err{color:var(--bad)}

.res{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);text-align:center}
.res .tick{width:48px;height:48px;border-radius:50%;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.res h2{font-family:ui-serif,"New York",Georgia,serif;font-size:24px;margin:0 0 2px}
.res p{margin:0 0 16px;color:var(--sub);font-size:14px}
.res a,.res button{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:14px;font-size:16px;font-weight:700;text-decoration:none;border:0;cursor:pointer;margin-top:8px;font-family:inherit}
.res .dl{background:var(--ok);color:#fff;font-size:18px}
.res .sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.res .tip{margin:14px 0 0;font-size:13px}
.foot{margin:26px 2px 0;color:var(--sub);font-size:13px;display:flex;gap:8px;align-items:flex-start}
svg{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header>
  <h1>Gabung PDF</h1>
  <p class="lead">Satukan surat, CV, KTP, ijazah, dan transkrip menjadi satu file PDF yang rapi. Semua halaman otomatis disamakan jadi A4 tegak.</p>
</header>

<ol class="steps" id="steps">
  <li class="on" data-s="1"><i>1</i>Pilih</li>
  <li data-s="2"><i>2</i>Urutkan</li>
  <li data-s="3"><i>3</i>Simpan</li>
</ol>

<label class="drop" for="f">
  <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div>
  <b>Pilih file</b>
  <span>PDF atau foto (JPG, PNG). Boleh banyak sekaligus.</span>
</label>
<input id="f" type="file" accept="application/pdf,image/*" multiple>

<ul class="files" id="list"></ul>

<div id="tools" hidden>
  <div class="sum"><span id="count"></span><button type="button" id="clear">Hapus semua</button></div>
  <div class="field">
    <label for="nm">Nama file hasil</label>
    <div><input id="nm" type="text" value="Lamaran-Gabungan" autocapitalize="off" autocorrect="off" spellcheck="false"><em>.pdf</em></div>
  </div>
  <button class="main" id="go" type="button">Gabungkan jadi satu PDF</button>
</div>

<div class="msg" id="msg"></div>
<div id="out"></div>

<p class="foot">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:3px"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  <span>Semua diproses di perangkatmu. File tidak diunggah ke mana pun.</span>
</p>
</main>

<script>
(function(){
var items=[],uid=0,outUrl=null,dlUrl=null,outBlob=null,outName='';
var $=function(i){return document.getElementById(i)};
var list=$('list'),go=$('go'),msg=$('msg'),out=$('out'),tools=$('tools');

var IC={
 up:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
 dn:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
 x:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 dl:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>',
 sh:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m0 0L8 8m4-4l4 4M6 12v7a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-7"/></svg>',
 ey:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
 ck:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

function fmt(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}
function isPdf(f){return f.type==='application/pdf'||/\.pdf$/i.test(f.name)}
function say(t,err){msg.textContent=t||'';msg.className='msg'+(err?' err':'')}
function setStep(n){
  var li=document.querySelectorAll('#steps li');
  for(var i=0;i<li.length;i++){var s=i+1;li[i].className=s<n?'done':(s===n?'on':'');li[i].querySelector('i').innerHTML=s<n?'✓':s}
}

function mkBtn(svg,fn,dis,cls){var b=document.createElement('button');b.type='button';b.className='ib'+(cls?' '+cls:'');b.innerHTML=svg;b.disabled=!!dis;b.onclick=fn;return b}

function render(){
  list.innerHTML='';
  items.forEach(function(it,i){
    var pdf=isPdf(it.file);
    var li=document.createElement('li');
    li.innerHTML='<div class="badge '+(pdf?'pdf':'img')+'">'+(pdf?'PDF':'FOTO')+'<small>'+(i+1)+'</small></div><div class="meta"><b></b><span></span></div><div class="ctl"></div>';
    li.querySelector('b').textContent=it.file.name;
    li.querySelector('span').textContent=fmt(it.file.size)+(it.pages?' · '+it.pages+' hal':'');
    var c=li.querySelector('.ctl');
    c.appendChild(mkBtn(IC.up,function(){mv(i,-1)},i===0));
    c.appendChild(mkBtn(IC.dn,function(){mv(i,1)},i===items.length-1));
    c.appendChild(mkBtn(IC.x,function(){items.splice(i,1);reset();render()},false,'x'));
    list.appendChild(li);
  });
  tools.hidden=items.length===0;
  $('count').textContent=items.length+' file dipilih';
  if(!outUrl)setStep(items.length?2:1);
}
function mv(i,d){var j=i+d;if(j<0||j>=items.length)return;var t=items[i];items[i]=items[j];items[j]=t;reset();render()}
function reset(){out.innerHTML='';if(outUrl){URL.revokeObjectURL(outUrl);outUrl=null}if(dlUrl){URL.revokeObjectURL(dlUrl);dlUrl=null}outBlob=null;say('')}

$('clear').onclick=function(){items=[];reset();render()};

$('f').addEventListener('change',function(e){
  var fs=Array.prototype.slice.call(e.target.files||[]);
  fs.forEach(function(f){
    var it={file:f,id:++uid,pages:0};items.push(it);
    if(isPdf(f)&&window.PDFLib){
      readBuf(f).then(function(b){return PDFLib.PDFDocument.load(b,{ignoreEncryption:true})})
        .then(function(d){it.pages=d.getPageCount();render()}).catch(function(){});
    }
  });
  e.target.value='';reset();render();
});

function readBuf(f){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){res(r.result)};
    r.onerror=function(){rej(new Error('Gagal membaca file "'+(f.name||'')+'".'))};
    r.readAsArrayBuffer(f);
  });
}
function imgToJpeg(f){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(f),im=new Image();
    im.onload=function(){
      var w=im.naturalWidth,h=im.naturalHeight,s=Math.min(1,2400/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
      x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(function(b){
        if(!b){rej(new Error('Gagal memproses foto "'+f.name+'".'));return}
        readBuf(b).then(function(buf){res({buf:buf,w:c.width,h:c.height})},rej);
      },'image/jpeg',0.92);
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Foto "'+f.name+'" tidak bisa dibuka. Coba simpan ulang sebagai JPG atau PNG.'))};
    im.src=url;
  });
}

async function merge(){
  var PD=PDFLib.PDFDocument,doc=await PD.create();
  var PW=595.28,PH=841.89,M=28;           // semua halaman: A4 tegak
  for(var i=0;i<items.length;i++){
    var f=items[i].file;
    say('Memproses '+(i+1)+' dari '+items.length+': '+f.name);
    if(isPdf(f)){
      var buf=await readBuf(f),src,emb;
      try{src=await PD.load(buf,{ignoreEncryption:true});emb=await doc.embedPdf(src,src.getPageIndices())}
      catch(e){throw new Error('File "'+f.name+'" rusak atau dikunci, tidak bisa dibaca.')}
      for(var k=0;k<emb.length;k++){
        var sp=src.getPage(k),sz=sp.getSize(),rw=sz.width,rh=sz.height;
        var ang=((sp.getRotation().angle%360)+360)%360;
        var ew=(ang===90||ang===270)?rh:rw, eh=(ang===90||ang===270)?rw:rh;
        var nearA4=ang===0&&Math.abs(ew/eh-PW/PH)<0.02;
        var m=nearA4?0:M;
        var sc=Math.min((PW-2*m)/ew,(PH-2*m)/eh);
        var dw=ew*sc,dh=eh*sc,X=(PW-dw)/2,Y=(PH-dh)/2;
        var pg=doc.addPage([PW,PH]);
        var o={width:rw*sc,height:rh*sc};
        if(ang===0){o.x=X;o.y=Y}
        else if(ang===90){o.x=X;o.y=Y+rw*sc;o.rotate=PDFLib.degrees(-90)}
        else if(ang===180){o.x=X+rw*sc;o.y=Y+rh*sc;o.rotate=PDFLib.degrees(180)}
        else{o.x=X+rh*sc;o.y=Y;o.rotate=PDFLib.degrees(90)}
        pg.drawPage(emb[k],o);
      }
    }else{
      var im=await imgToJpeg(f),jpg=await doc.embedJpg(im.buf);
      var sc2=Math.min((PW-2*M)/im.w,(PH-2*M)/im.h);
      var iw=im.w*sc2,ih=im.h*sc2,pg2=doc.addPage([PW,PH]);
      pg2.drawImage(jpg,{x:(PW-iw)/2,y:(PH-ih)/2,width:iw,height:ih});
    }
  }
  say('Menyimpan hasil...');
  return await doc.save();
}

function showResult(){
  var canShare=false;
  try{canShare=!!(navigator.canShare&&navigator.canShare({files:[new File([outBlob],outName,{type:'application/pdf'})]}))}catch(e){}
  out.innerHTML='<div class="res"><div class="tick">'+IC.ck+'</div><h2>PDF siap disimpan</h2><p></p>'+
   '<a class="dl" id="dl">'+IC.dl+'Download PDF</a>'+
   (canShare?'<button type="button" class="sec" id="sh">'+IC.sh+'Bagikan / Simpan ke Files</button>':'')+
   '<a class="sec" id="op" target="_blank" rel="noopener">'+IC.ey+'Buka untuk dicek</a>'+
   '<p class="tip">Kalau file malah terbuka di pratinjau, ketuk ikon bagikan di pratinjau, lalu pilih <b>Simpan ke File</b>.</p></div>';
  out.querySelector('p').textContent=outName+' · '+fmt(outBlob.size);
  var a=$('dl');a.href=dlUrl;a.download=outName;
  $('op').href=outUrl;
  if(canShare)$('sh').onclick=function(){
    navigator.share({files:[new File([outBlob],outName,{type:'application/pdf'})],title:outName}).catch(function(){});
  };
  setStep(4);
  out.scrollIntoView({behavior:'smooth',block:'center'});
}

go.addEventListener('click',async function(){
  if(typeof PDFLib==='undefined'){say('Pustaka PDF belum termuat. Pastikan internet aktif lalu muat ulang halaman ini.',true);return}
  go.disabled=true;reset();say('Mulai menggabungkan...');
  try{
    var bytes=await merge();
    outBlob=new Blob([bytes],{type:'application/pdf'});
    outUrl=URL.createObjectURL(outBlob);
    dlUrl=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'}));
    var n=($('nm').value||'Gabungan').replace(/\.pdf$/i,'').replace(/[\\\/:*?"<>|]+/g,'').trim()||'Gabungan';
    outName=n+'.pdf';
    say('');showResult();
  }catch(e){say(e.message||'Terjadi kesalahan saat menggabungkan.',true)}
  go.disabled=false;
});

render();
})();
</script>
</body>
</html>
